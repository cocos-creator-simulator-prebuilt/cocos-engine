name: Gen Simulator

on:
  push:
  release:
    types: [published]

jobs:
  build_simulator_ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - name: Build Simulator TS files to JS
        run: |
          cd .github/workflows
          node build-simulator-ts.js

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with: 
          name: native-preview
          path: bin/native-preview

  win_gen_simulator:
    runs-on: windows-2019
    name: Windows
    defaults:
      run:
        working-directory: ${{github.workspace}}/native

    steps:
      - uses: actions/checkout@v4
      - name: npm install
        run: |
          npm install
      - name: Download external libraries
        shell: bash
        run: |
          EXT_VERSION=`node ../.github/workflows/get-native-external-version.js`
          git clone --branch $EXT_VERSION --depth 1 https://github.com/cocos/cocos-engine-external external

      - name: Install deps
        uses: humbletim/setup-vulkan-sdk@523828e49cd4afabce369c39c7ee6543a2b7a735
        with:
          vulkan-query-version: 1.2.189.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: false
      - name: gen simulator
        run: |
          npx gulp gen-simulator
      - name: check result
        run: |
          Get-ChildItem ./simulator/Release -Name SimulatorApp-Win32.exe
          if(Test-Path ./simulator/Release/SimulatorApp-Win32.exe) {exit 0} else {exit 1}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with: 
          name: SimulatorApp-Win32
          path: ./simulator/Release/SimulatorApp-Win32.exe

  mac_gen_simulator:
    runs-on: macos-latest
    name: MacOS
    defaults:
      run:
        working-directory: ${{github.workspace}}/native
    steps:
      - uses: actions/checkout@v4
      - name: npm install
        run: |
          npm install
          npm install gulp -g
      - name: Download external libraries
        run: |
          EXT_VERSION=`node ../.github/workflows/get-native-external-version.js`
          git clone --branch $EXT_VERSION --depth 1 https://github.com/cocos/cocos-engine-external external

      - name: gen simulator
        run: |
          npx gulp gen-simulator-release
      - name: check result
        run: |
          find ./ -name SimulatorApp-Mac
          echo "==> Show lipo info: "
          lipo -info simulator/Release/SimulatorApp-Mac.app/Contents/MacOS/SimulatorApp-Mac
          [ -f ./simulator/Release/SimulatorApp-Mac.app/Contents/MacOS/SimulatorApp-Mac ] && exit 0 || exit 1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with: 
          name: SimulatorApp-Mac
          path: ./simulator/Release/SimulatorApp-Mac.app

  release_package:
    if: github.event_name == 'release'
    name: "Release packages"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build_simulator_ts, win_gen_simulator, mac_gen_simulator]
    steps:
    - name: Download android Artifacts (android-armeabi-v7a)
      uses: actions/download-artifact@v4
      with:
        name: native-preview
        path: artifacts/native-preview

    - name: Download android Artifacts (android-arm64-v8a)
      uses: actions/download-artifact@v4
      with:
        name: SimulatorApp-Win32
        path: artifacts/SimulatorApp-Win32

    - name: Download android Artifacts (android-x86)
      uses: actions/download-artifact@v4
      with:
        name: SimulatorApp-Mac
        path: artifacts/SimulatorApp-Mac

    - name: Pack dist files
      if: github.event_name == 'release'
      uses: thedoctor0/zip-release@main
      with:
        type: 'zip'
        directory: 'artifacts'
        path: '.'
        filename: 'cocos-creator-simulator-${{ github.event.release.tag_name }}.zip'

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: artifacts/cocos-creator-simulator-${{ github.event.release.tag_name }}.zip
        asset_name: cocos-creator-simulator-${{ github.event.release.tag_name }}.zip
        tag: ${{ github.ref }}
